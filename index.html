<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách sản phẩm</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #333333;
      padding: 10px 12px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h1>Danh sách sản phẩm</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
        <th>Số lượng</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Bàn phím cơ</td>
        <td>850.000 đ</td>
        <td>15</td>
      </tr>
      <tr>
        <td>Chuột không dây</td>
        <td>350.000 đ</td>
        <td>25</td>
      </tr>
      <tr>
        <td>Tai nghe Gaming</td>
        <td>550.000 đ</td>
        <td>10</td>
      </tr>
      <tr>
        <td>Lót chuột cỡ lớn</td>
        <td>120.000 đ</td>
        <td>40</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
